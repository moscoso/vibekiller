<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vibe Killer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #e8d4a0;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #game-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container canvas {
      image-rendering: pixelated;
      display: block;
    }
    .overlay {
      position: absolute;
      pointer-events: none;
      z-index: 10;
      letter-spacing: 2px;
      text-shadow: 1px 1px 0 #000, 0 0 6px rgba(0,0,0,0.8);
    }
    #title {
      top: 10px;
      left: 14px;
      color: #e8b040;
      font-size: 14px;
      letter-spacing: 4px;
    }
    #title span { color: #e83838; }
    #controls {
      bottom: 10px;
      right: 14px;
      font-size: 11px;
      color: #b8956a;
    }
    #controls b { color: #e8b040; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="title" class="overlay">VIBE <span>KILLER</span></div>
  <div id="controls" class="overlay">
    <b>WASD</b>/<b>ARROWS</b> move &nbsp;·&nbsp; <b>SPACE</b> high-five &nbsp;·&nbsp; <b>R</b> restart
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
