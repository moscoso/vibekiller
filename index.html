<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vibe Killer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0408;
      color: #e8d4a0;
      font-family: 'Courier New', monospace;
      min-height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      color: #e8b040;
      letter-spacing: 6px;
      font-size: 22px;
      margin: 12px 0 8px;
      text-shadow: 2px 2px 0 #5c2820;
    }
    h1 span { color: #e83838; }
    #game-container {
      box-shadow: 0 0 32px rgba(232, 50, 30, 0.3),
                  0 0 12px rgba(0, 0, 0, 0.8);
      border: 2px solid #5c2820;
      image-rendering: pixelated;
    }
    .controls {
      margin-top: 10px;
      font-size: 12px;
      color: #b8956a;
      letter-spacing: 1px;
    }
    .controls b { color: #e8b040; }
  </style>
</head>
<body>
  <h1>VIBE <span>KILLER</span></h1>
  <div id="game-container"></div>
  <div class="controls">
    <b>WASD</b> / <b>ARROWS</b> move &nbsp;·&nbsp; <b>SPACE</b> high-five &nbsp;·&nbsp; <b>R</b> restart
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
